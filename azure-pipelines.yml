trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'Institutolala'
  webAppName: 'prdinllalamx'
  nodeVersion: '22.x'

stages:
  - stage: Build
    displayName: 'Compilar Next.js'
    jobs:
      - job: BuildJob
        displayName: 'Install & Build'
        steps:
          - task: UseNode@1
            inputs:
              version: $(nodeVersion)
            displayName: 'Usar Node.js $(nodeVersion)'

          - script: |
              npm ci
              npm run build
              cp -r public .next/standalone/public
              mkdir -p .next/standalone/.next
              cp -r .next/static .next/standalone/.next/static
            displayName: 'Instalar, compilar y preparar standalone'
            env:
              STRAPI_URL: $(STRAPI_URL)
              STRAPI_HOST: $(STRAPI_HOST)
              STRAPI_API_TOKEN: $(STRAPI_API_TOKEN)

          - task: ArchiveFiles@2
            displayName: 'Empaquetar artefacto standalone'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/.next/standalone'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
            artifact: drop
            displayName: 'Publicar artefacto'

  - stage: Deploy
    displayName: 'Desplegar en Azure App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWeb
        displayName: 'Deploy to prdinllalamx'
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Azure Web App Deploy: prdinllalamx'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webAppLinux'
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                    startUpCommand: 'node server.js'